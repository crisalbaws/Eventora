  <script>(function(){
    var base = document.querySelector('base')?.getAttribute('href') || '/';
    var baseClean = base.replace(/\/$/, '');
    var path = location.pathname;
    if (baseClean && path.startsWith(baseClean)) path = path.slice(baseClean.length);
    path = path.replace(/^\/+/, '');
    if (path && !location.hash) {
      location.replace((baseClean || '') + '/#/' + path + location.search);
      return;
    }
    var h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    var r = h || path;
    var negocio = /^\/?(login|p|admin|suspendida)(\/|$)/.test(r) || (r === '' && !location.hash);
    var isVista = /[?&]vista=1/.test(location.search) || /[?&]vista=1/.test(location.hash);
    if (!negocio || isVista) {
      var b = document.getElementById('boot');
      if (b) b.remove();
    }
  })();</script>
